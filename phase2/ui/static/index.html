<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation Factory</title>
<style>
  :root { --bg:#fff6e5; --card:#ffffff; --ink:#1d1d1f; --mut:#6b6b73; --line:#e3d9c6; --acc:#f26b21; --ok:#2e9e5b; --bad:#d64545; --warn:#c98a00; --blue:#3b6fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a17; --card:#26241f; --ink:#f3efe6; --mut:#a8a396; --line:#3a372f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0 8px 0 0; color:var(--acc); }
  select, input, textarea, button { font:inherit; color:inherit; }
  select, input, textarea { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 9px; }
  input[type=number] { width:96px; }
  textarea { width:100%; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:7px 13px; cursor:pointer; font-weight:600; }
  button.sec { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.ok { background:var(--ok); } button.bad { background:var(--bad); } button.sm { padding:3px 9px; font-size:13px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  nav { display:flex; gap:2px; padding:0 20px; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { background:transparent; color:var(--mut); border-radius:0; border-bottom:3px solid transparent; padding:11px 14px; white-space:nowrap; }
  nav button.on { color:var(--ink); border-bottom-color:var(--acc); }
  main { padding:20px; max-width:1280px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:16px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; } @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; background:var(--line); color:var(--ink); }
  .badge.ok { background:var(--ok); color:#fff; } .badge.bad { background:var(--bad); color:#fff; } .badge.warn { background:var(--warn); color:#fff; } .badge.run { background:var(--blue); color:#fff; }
  .mut { color:var(--mut); font-size:13px; }
  img.prev { width:100%; border-radius:8px; border:1px solid var(--line); background:#fff; display:block; }
  img.big { max-width:100%; cursor:zoom-in; }
  video { width:100%; max-height:70vh; background:#000; border-radius:10px; }
  pre.log { background:#15130f; color:#e8e2d0; padding:12px; border-radius:8px; max-height:300px; overflow:auto; font-size:12px; white-space:pre-wrap; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; }
  .msg.err { background:rgba(214,69,69,.15); border:1px solid var(--bad); } .msg.good { background:rgba(46,158,91,.15); border:1px solid var(--ok); } .msg.warn { background:rgba(201,138,0,.15); border:1px solid var(--warn); }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  .fb { border-left:3px solid var(--acc); padding:2px 10px; margin:6px 0; font-size:13px; }
  .fb.done { border-left-color:var(--ok); opacity:.6; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); padding:20px; width:min(640px, 94vw); max-height:90vh; overflow:auto; }
  label { display:block; font-size:13px; color:var(--mut); margin:9px 0 3px; }
  .hide { display:none; }
  .diff td:nth-child(2) { background:rgba(214,69,69,.10); } .diff td:nth-child(3) { background:rgba(46,158,91,.12); }
  .item { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; }
  .item .grid2 { gap:4px 12px; }
  .step { display:flex; gap:8px; align-items:center; padding:3px 0; }
  details > summary { cursor:pointer; color:var(--mut); }
  .sec-h { margin:0 0 8px; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>Animation Factory</h1>
  <select id="proj" aria-label="Dự án"></select>
  <button class="sec" id="btnNew">+ Dự án mới</button>
  <input id="who" placeholder="Người duyệt (tên bạn)" title="Tên ghi vào lịch sử duyệt" style="width:170px">
  <span id="state" class="badge"></span><span id="runflag" class="badge run hide"></span>
</header>
<nav id="tabs">
  <button data-t="ov" class="on">Tổng quan</button><button data-t="script">Kịch bản</button><button data-t="board">Storyboard</button><button data-t="assets">Asset</button>
  <button data-t="prod">Sản xuất</button><button data-t="result">Kết quả</button><button data-t="channel">Hồ sơ kênh</button>
</nav>
<main>
  <div id="notice"></div>
  <section id="t-ov"></section><section id="t-script" class="hide"></section><section id="t-board" class="hide"></section><section id="t-assets" class="hide"></section>
  <section id="t-prod" class="hide"></section><section id="t-result" class="hide"></section><section id="t-channel" class="hide"></section>
</main>
<dialog id="dlgNew">
  <h3 style="margin-top:0">Dự án mới</h3>
  <label>Chủ đề / tiêu đề video *</label><input id="nTitle" style="width:100%" placeholder="vd: Quỹ khẩn cấp là gì, nên có bao nhiêu?">
  <label>Mục tiêu (người xem làm được gì sau video)</label><input id="nGoal" style="width:100%">
  <label>Thông điệp chính</label><textarea id="nMsg" rows="2"></textarea>
  <div class="grid2"><div><label>Đối tượng xem (để trống = theo hồ sơ kênh)</label><input id="nAud" style="width:100%"></div>
    <div><label>Thời lượng mong muốn (giây)</label><input id="nDur" type="number" min="20" max="300" placeholder="75"></div>
    <div><label>Hồ sơ kênh</label><select id="nChan" style="width:100%"></select></div>
    <div><label>Nghiên cứu nguồn</label><select id="nRes" style="width:100%"><option value="auto">Tự quyết định</option><option value="yes">Luôn tra cứu</option><option value="no">Không tra cứu</option></select></div></div>
  <label>Tài liệu tham khảo (link hoặc ghi chú, mỗi dòng một mục)</label><textarea id="nRef" rows="2"></textarea>
  <label>Kịch bản có sẵn (tùy chọn; mỗi đoạn cách nhau một dòng trống = một cảnh; AI sẽ không viết lại)</label><textarea id="nScript" rows="4"></textarea>
  <label>Hướng dẫn câu chuyện (tùy chọn)</label><textarea id="nGuide" rows="2"></textarea>
  <div class="grid2"><div><label>Nhân vật</label><select id="nCharMode" style="width:100%"><option value="ai">AI thiết kế nhân vật mới</option><option value="bi">Dùng nhân vật Bi có sẵn</option></select></div>
    <div><label>Dùng lại hình</label><select id="nPolicy" style="width:100%"><option value="new">Tạo mới toàn bộ</option><option value="series">Tiếp series</option><option value="library">Chỉ asset tôi chọn</option></select></div>
    <div><label>Series: dự án gốc</label><input id="nSeries" style="width:100%"></div></div>
  <label>Mô tả nhân vật chính (tùy chọn)</label><textarea id="nCharHint" rows="2"></textarea>
  <details><summary>Ngân sách dự án (để trống = mặc định)</summary>
    <div class="grid2"><div><label>Số lượt gọi AI tối đa</label><input id="nBCalls" type="number" min="1"></div><div><label>Số lượt tạo ảnh tối đa</label><input id="nBImg" type="number" min="0"></div>
    <div><label>Credit giọng đọc tối đa</label><input id="nBVoice" type="number" min="0"></div></div></details>
  <div class="row" style="margin-top:14px"><button id="nOk">Tạo</button><button class="sec" id="nCancel">Hủy</button></div>
</dialog>
<dialog id="dlgImg"><img id="bigimg" class="big" style="cursor:default"><div class="row" style="margin-top:8px"><button class="sec" id="imgClose">Đóng</button></div></dialog>
<script>
const TOKEN = "__TOKEN__";
let P = null, PREP = null, PROD = null, CAP = null, CHARS = { characters: [], plan: {} }, cur = null, tab = "ov", poll = null;
const DRAFT = {};                      // scene id -> draft object being edited in the storyboard form
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const TABS = ["ov", "script", "board", "assets", "prod", "result", "channel"];
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

async function api(method, path, body) {
  const r = await fetch("/api" + path, { method, headers: { "X-AF-Token": TOKEN, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.data = j; throw e; }
  return j;
}
function notice(msg, kind) { $("#notice").innerHTML = msg ? `<div class="msg ${kind || ""}">${msg}</div>` : ""; if (msg) window.scrollTo({ top: 0, behavior: "smooth" }); }
function fail(e) {
  let html = esc(e.message);
  if (e.data && e.data.errors) html += "<ul>" + e.data.errors.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>";
  notice(html, "err");
}
const who = () => $("#who").value.trim();
function needWho() { if (!who()) { notice("Nhập tên người duyệt ở ô trên cùng (ghi vào lịch sử duyệt).", "err"); $("#who").focus(); return false; } return true; }
const badge = (s, map) => { const m = map || { ok: "ok", failed: "bad", interrupted: "bad", waiting: "warn", running: "run", stale: "warn", skipped: "ok" }; return `<span class="badge ${m[s] || ""}">${esc(s || "—")}</span>`; };
const STATE_VI = { ok: "xong", failed: "lỗi", running: "đang chạy", pending: "chưa chạy", waiting: "chờ duyệt", interrupted: "bị ngắt", skipped: "đã có (không gọi lại)" };
const stBadge = s => `<span class="badge ${({ ok: "ok", skipped: "ok", failed: "bad", interrupted: "bad", waiting: "warn", running: "run" })[s] || ""}">${esc(STATE_VI[s] || s || "—")}</span>`;

// ------------------------------------------------------------------ loading
async function loadList(select) {
  const { projects } = await api("GET", "/projects");
  $("#proj").innerHTML = projects.map(p => `<option value="${p.name}">${esc(p.name)} · ${esc(p.title)} (v${p.version})</option>`).join("");
  const want = select || store.get("af_proj");
  if (want && projects.some(p => p.name === want)) $("#proj").value = want;
  cur = $("#proj").value || null;
  if (cur) store.set("af_proj", cur);
}
async function load(only) {
  if (!cur) { P = null; return render(); }
  const [p, prep, prod, chars] = await Promise.all([api("GET", "/project/" + cur), api("GET", `/project/${cur}/prepare`), api("GET", `/project/${cur}/production`), api("GET", `/project/${cur}/characters`)]);
  P = p; PREP = prep; PROD = prod; CHARS = chars;
  if (!CAP) CAP = await api("GET", "/capabilities?project=" + cur); else if (P) CAP = await api("GET", "/capabilities?project=" + cur);
  render(only);
  schedule();
}
function busy() { return P && (P.running || (PROD && PROD.jobs.some(j => ["queued", "running"].includes(j.state))) || (PREP && Object.values(PREP.overview.steps).some(s => s.state === "running"))); }
function schedule() { clearTimeout(poll); if (busy()) poll = setTimeout(tick, 2500); }
async function tick() {
  try { const [p, prep, prod, chars] = await Promise.all([api("GET", "/project/" + cur), api("GET", `/project/${cur}/prepare`), api("GET", `/project/${cur}/production`), api("GET", `/project/${cur}/characters`)]);
    const wasRun = busy(); P = p; PREP = prep; PROD = prod; CHARS = chars; stateBadge(); renderOv(); renderProd(); renderResult();
    if (tab === "assets" && !$("#t-assets").contains(document.activeElement)) renderAssets();
    if (wasRun && !busy()) { render(); notice("Công việc đã xong. Xem kết quả ở các tab.", "good"); }
  } catch (e) { /* server restarting */ }
  schedule();
}
function stateBadge() {
  const st = P.status || {}; const s = $("#state");
  s.textContent = st.state || "—"; s.className = "badge " + (/fail/.test(st.state || "") ? "bad" : /awaiting|brief/.test(st.state || "") ? "warn" : /ready|built|approved/.test(st.state || "") ? "ok" : "");
  const rf = $("#runflag"); rf.classList.toggle("hide", !busy()); rf.textContent = P.running ? `đang chạy: ${P.running.kind}` : "đang xử lý job…";
}
function render(only) {
  if (!P) { TABS.filter(t => t !== "channel").forEach(t => $("#t-" + t).innerHTML = '<div class="card">Chưa có dự án. Bấm “+ Dự án mới”.</div>'); renderChannel(); return; }
  stateBadge();
  const all = { ov: renderOv, script: renderScript, board: renderBoard, assets: renderAssets, prod: renderProd, result: renderResult, channel: renderChannel };
  (only ? [only] : TABS).forEach(t => all[t]());
}
function goto(t) { $$("#tabs button").forEach(x => x.classList.toggle("on", x.dataset.t === t)); TABS.forEach(x => $("#t-" + x).classList.toggle("hide", x !== t)); tab = t; store.set("af_tab", t); location.hash = t; }
async function run(kind, extra) {
  try { await api("POST", `/project/${cur}/run`, { kind, ...extra }); notice("Đã bắt đầu chạy. Tiến độ ở tab Sản xuất.", "good"); await load(); } catch (e) { fail(e); }
}
const prepare = (step, force) => run("prepare", { step, force: force || [] });

// ------------------------------------------------------------------ overview
function briefForm() {
  const b = P.brief || {}, bud = b.budget || {}, u = PROD.costs.usage, lim = PROD.costs.limits;
  return `<div class="card"><h3 class="sec-h">Brief của dự án</h3>
  <div class="grid2"><div><label>Tiêu đề / chủ đề</label><input id="bTitle" style="width:100%" value="${esc(b.title)}"></div><div><label>Hồ sơ kênh</label><select id="bChan" style="width:100%">${(window.CHANNELS || []).map(c => `<option value="${c.id}" ${c.id === (b.channel || "default") ? "selected" : ""}>${esc(c.name)} (${c.id})</option>`).join("")}</select></div>
  <div><label>Mục tiêu</label><input id="bGoal" style="width:100%" value="${esc(b.goal)}"></div><div><label>Thời lượng mong muốn (giây)</label><input id="bDur" type="number" value="${esc(b.duration_seconds ?? "")}"></div></div>
  <label>Thông điệp chính</label><textarea id="bMsg" rows="2">${esc(b.message)}</textarea>
  <div class="grid2"><div><label>Đối tượng xem (trống = theo kênh)</label><input id="bAud" style="width:100%" value="${esc(b.audience)}"></div>
  <div><label>Nghiên cứu nguồn</label><select id="bRes" style="width:100%">${["auto", "yes", "no"].map(v => `<option value="${v}" ${b.research === v ? "selected" : ""}>${({ auto: "Tự quyết định", yes: "Luôn tra cứu", no: "Không tra cứu" })[v]}</option>`).join("")}</select></div></div>
  <label>Tài liệu tham khảo</label><textarea id="bRef" rows="2">${esc(b.references)}</textarea>
  <label>Ghi chú cho người viết kịch bản</label><textarea id="bNotes" rows="2">${esc(b.notes)}</textarea>
  <label>Kịch bản có sẵn (nếu có: AI không viết lại)</label><textarea id="bScript" rows="3">${esc(b.script_text)}</textarea>
  <label>Hướng dẫn câu chuyện (thế giới truyện, cách kể, điều cần tránh)</label><textarea id="bGuide" rows="2">${esc(b.story_guideline)}</textarea>
  <div class="grid2"><div><label>Nhân vật</label><select id="bCharMode" style="width:100%"><option value="ai" ${b.character_mode === "ai" ? "selected" : ""}>AI thiết kế nhân vật mới cho video này</option><option value="bi" ${b.character_mode !== "ai" ? "selected" : ""}>Dùng nhân vật Bi có sẵn</option></select></div>
    <div><label>Chính sách dùng lại hình</label><select id="bPolicy" style="width:100%">${[["new", "Tạo mới toàn bộ cho dự án này"], ["series", "Tiếp series (dùng nhân vật/asset của dự án khác)"], ["library", "Chỉ dùng asset tôi chọn"], ["legacy", "Cũ: dùng lại asset đã duyệt tự do"]].map(([v, l]) => `<option value="${v}" ${b.asset_policy === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div><label>Series: tên dự án gốc (khi tiếp series)</label><input id="bSeries" style="width:100%" value="${esc(b.series_from)}"></div>
    <div><label>Asset chọn dùng (mỗi dòng: dự án/asset_id)</label><textarea id="bLib" rows="2">${esc((b.library_assets || []).join("\n"))}</textarea></div></div>
  <label>Mô tả nhân vật chính của bạn (tùy chọn; để trống = AI tự đề xuất theo câu chuyện)</label><textarea id="bCharHint" rows="2">${esc(b.character_hint)}</textarea>
  <details style="margin-top:8px"><summary>Ngân sách (đã dùng / hạn mức)</summary><div class="grid2">
    <div><label>Lượt gọi AI: ${u.llm_calls} / ${lim.llm_calls ?? "∞"}</label><input id="bgCalls" type="number" value="${esc(bud.llm_calls ?? "")}" placeholder="mặc định ${lim.llm_calls ?? ""}"></div>
    <div><label>Lượt tạo ảnh: ${u.images} / ${lim.images ?? "∞"}</label><input id="bgImg" type="number" value="${esc(bud.images ?? "")}" placeholder="mặc định ${lim.images ?? ""}"></div>
    <div><label>Credit giọng đọc: ${u.voice_credits} / ${lim.voice_credits ?? "∞"}</label><input id="bgVoice" type="number" value="${esc(bud.voice_credits ?? "")}" placeholder="mặc định ${lim.voice_credits ?? ""}"></div></div></details>
  <div class="row" style="margin-top:10px"><button id="bSave">Lưu brief</button><span class="mut">Đổi brief làm các bước AI liên quan hết “mới” — chạy lại chỉ gọi AI cho bước có đầu vào thay đổi.</span></div></div>`;
}
function renderOv() {
  const steps = PREP.overview.steps, todo = PROD.todo, prob = PROD.problems;
  const flow = [["research", "Nghiên cứu nguồn"], ["script", "Kịch bản"], ["characters", "Nhân vật (AI thiết kế dàn diễn viên)"], ["storyboard", "Storyboard"], ["assetplan", "Kế hoạch asset"], ["assets", "Tạo asset (sau khi duyệt kế hoạch)"]];
  $("#t-ov").innerHTML = `
  <div class="card"><h3 class="sec-h">${esc(P.title)} <span class="mut">· storyboard v${P.version} · ${P.scenes.length} cảnh</span></h3>
    <div class="row"><button id="aiAll" ${P.running ? "disabled" : ""}>AI chuẩn bị: nghiên cứu → kịch bản → storyboard → kế hoạch asset</button>
      <span class="mut">Dừng lại ở bước bạn duyệt. Không bước nào tạo giọng (có phí) trước khi bạn duyệt lời đọc.</span></div>
    <div style="margin-top:10px">${flow.map(([k, l]) => { const s = steps[k] || {}; return `<div class="step">${stBadge(s.state)} <b>${l}</b> <span class="mut">${s.llm_calls != null ? s.llm_calls + " lượt gọi AI" : ""} ${esc(s.error || "")}</span></div>`; }).join("")}</div></div>
  <div class="card"><h3 class="sec-h">Cần bạn quyết định (${todo.length})</h3>${todo.length ? `<table>${todo.map(t => `<tr><td>${esc(t.label)}<div class="mut">${esc(t.detail)}</div></td><td><button class="sec sm" data-go="${t.tab}">Mở</button></td></tr>`).join("")}</table>` : '<div class="mut">Không có việc nào chờ bạn.</div>'}</div>
  ${prob.length ? `<div class="card"><h3 class="sec-h">Lỗi / cần xử lý (${prob.length})</h3><table>${prob.map(x => `<tr><td><b>${esc(x.where)}</b></td><td>${esc(x.message)}</td></tr>`).join("")}</table>
    <div class="row" style="margin-top:8px"><button id="resume">Chạy tiếp từ bước lỗi</button><span class="mut">Kết quả đã xong được giữ; không gọi lại AI/giọng/ảnh đã thành công.</span></div></div>` : ""}
  ${oppCard()}
  ${briefForm()}`;
  $$("[data-go]", $("#t-ov")).forEach(b => b.onclick = () => goto(b.dataset.go));
  $("#aiAll").onclick = () => prepare("all");
  if ($("#resume")) $("#resume").onclick = resume;
  $("#bSave").onclick = saveBrief;
  $("#oppRun").onclick = () => prepare("opportunity", ["opportunity"]);
  $$("[data-opp]", $("#t-ov")).forEach(b => b.onclick = async () => { const c = PREP.opportunities.candidates[+b.dataset.opp]; if (!confirm("Đặt chủ đề của dự án thành: " + c.topic + "?")) return;

function getPath(o, path) { return path.split(".").reduce((t, k) => (t == null ? t : t[k]), o); }
function ctl(path, kind, val, opts) {
  const v = val ?? "";
  if (kind === "select") return `<select data-p="${path}" data-k="str">${opts.map(o => `<option value="${esc(o)}" ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;

  return `<input data-p="${path}" data-k="str" value="${esc(v)}" style="width:100%">`;

function fieldCtl(path, f, val) {
  const t = f.type;
  if (t === "number") return ctl(path, "number", val);

  if (t === "text_color") return ctl(path, "select", val ?? "dark", CAP.text_colors);
  if (t === "accent") return ctl(path, "select", val ?? CAP.accent_colors[0], CAP.accent_colors);

}

        <div class="row" style="margin-top:8px"><button data-save="${s.id}">Lưu cảnh</button><button class="sec sm" data-mv="up|${s.id}">↑</button><button class="sec sm" data-mv="down|${s.id}">↓</button>

function wireBoard() {
  const root = $("#t-board");
  $("#prevAll").onclick = () => run("storyboard");
  $("#apBoard").onclick = () => approveKind("storyboard", "");
  $$(".card[data-sid]", root).forEach(card => {
    const sid = card.dataset.sid, d = DRAFT[sid];
    const rerender = () => { card.querySelector(".sform").innerHTML = sceneForm(d, sid); wireForm(); };
    const wireForm = () => {
      $$("[data-p]", card).forEach(el => { el.oninput = el.onchange = () => {
        const k = el.dataset.k; let v = el.value;
        if (k === "bool") v = el.checked; else if (k === "num") v = num(v); else if (k === "optnum") { if (v === "") { const p = el.dataset.p.split("."); const last = p.pop(); const o = getPath(d, p.join(".")); if (o) delete o[last]; return; } v = Number(v); }
        else if (k === "appear") v = (v !== "" && !isNaN(Number(v))) ? Number(v) : v; else if (k === "lines") v = v.split("\n").map(x => x.trim()).filter(Boolean).map(x => (isNaN(Number(x)) ? x : Number(x)));
        else if (k === "csv") v = v.split(",").map(x => x.trim()).filter(Boolean);
        if (el.dataset.p === "camera" && v === "") { delete d.camera; return; }
        if (el.dataset.p === "bg" && v === "") return;
        if (el.dataset.p === "bi.char" && (v === "bi" || v === "")) { delete d.bi.char; card.querySelector(".sres").innerHTML = '<span class="badge warn">chưa lưu</span>'; return; }
        setPath(d, el.dataset.p, v); card.querySelector(".sres").innerHTML = '<span class="badge warn">chưa lưu</span>';
      }; });
      const listAt = (path) => { const ks = path.split("."); let t = d; ks.forEach(k => { if (t[k] == null) t[k] = (k === "actions" || k === "face_cues" || k === "cast") ? [] : {}; t = t[k]; }); return t; };
      $$("[data-act-del]", card).forEach(b => b.onclick = () => { const [p, i] = b.dataset.actDel.split("|"); listAt(p).splice(+i, 1); rerender(); });
      $$("[data-act-add]", card).forEach(b => b.onclick = () => { listAt(b.dataset.actAdd).push({ name: CAP.actions[0].name, at: 0.5 }); rerender(); });
      $$("[data-fc-del]", card).forEach(b => b.onclick = () => { const [p, i] = b.dataset.fcDel.split("|"); listAt(p).splice(+i, 1); rerender(); });
      $$("[data-fc-add]", card).forEach(b => b.onclick = () => { listAt(b.dataset.fcAdd).push({ cue: "", face: CAP.faces[0] }); rerender(); });
      $$("[data-cast-add]", card).forEach(b => b.onclick = () => { const used = new Set([d.bi.char || "bi", ...(d.cast || []).map(c => c.char)]); const other = CAP.characters.find(c => !used.has(c.id)) || CAP.characters[0];
        (d.cast = d.cast || []).push({ char: other.id, x: 1500, y: 960, scale: 1.0, flip: true, face: "neutral", pose: "idle", actions: [], face_cues: [] }); rerender(); });
      $$("[data-cast-del]", card).forEach(b => b.onclick = () => { d.cast.splice(+b.dataset.castDel, 1); if (!d.cast.length) delete d.cast; rerender(); });
      $$("[data-item-del]", card).forEach(b => b.onclick = () => { d.items.splice(+b.dataset.itemDel, 1); rerender(); });
      $$("[data-item-add]", card).forEach(b => b.onclick = () => { const t = $("#addType-" + sid).value, it = { type: t };
        CAP.item_types[t].fields.forEach(f => { if (!f.required) return; it[f.name] = f.type === "number" ? (f.name === "x" ? 1400 : f.name === "y" ? 540 : f.name === "scale" ? 1 : f.name === "size" ? 56 : f.name === "gap" ? 110 : 1) : f.type === "prop_img" ? CAP.props[0] : f.type.startsWith("list:") ? (f.type === "list:string" ? ["Mục 1"] : [{}]) : f.type === "text_color" ? "dark" : "…"; });
        if (t === "chart") it.bars = [{ label: "A", value: 3, text: "3", color: CAP.accent_colors[0] }, { label: "B", value: 6, text: "6", color: CAP.accent_colors[1] }];
        if (t === "pie") it.parts = [{ value: 60, color: CAP.accent_colors[0] }, { value: 40, color: CAP.accent_colors[1] }];
        if (t === "legend") it.rows = [{ text: "Mục 1", color: CAP.accent_colors[0] }];
        (d.items = d.items || []).push(it); rerender(); });
      $$("[data-sub-del]", card).forEach(b => b.onclick = () => { const [p, j] = b.dataset.subDel.split("|"); getPath(d, p).splice(+j, 1); rerender(); });
      $$("[data-sub-add]", card).forEach(b => b.onclick = () => { const [p, sub] = b.dataset.subAdd.split("|"); const row = {}; CAP.sub_fields[sub].forEach(s => { if (s.required) row[s.name] = s.type === "number" ? 1 : s.type === "accent" ? CAP.accent_colors[0] : "…"; }); getPath(d, p).push(row); rerender(); });
    };
    wireForm();
    card.querySelector("[data-save]").onclick = async () => {
      const out = clone(d); delete out.__base;
      try { const r = await api("PUT", `/project/${cur}/scene/${sid}`, { scene: out });
        const ch = r.realigned || [];
        notice(r.changed ? `Đã lưu cảnh ${sid} (v${r.version}). ${ch.length ? "Đã tự chỉnh mốc theo lời mới: " + [...new Set(ch.map(c => `“${esc(c.old)}” → ${esc(c.new)}`))].join("; ") + ". " : ""}Cần duyệt lại phần thay đổi.${(r.warnings || []).length ? "<br>Cảnh báo: " + r.warnings.map(esc).join("<br>") : ""}` : "Không có thay đổi.", "good");
        delete DRAFT[sid]; await load(); } catch (e) { card.querySelector(".sres").innerHTML = `<div class="msg err">${esc(e.message)}${(e.data && e.data.errors || []).map(x => "<br>" + esc(x)).join("")}</div>`; }
    };
    $$("[data-mv]", card).forEach(b => b.onclick = async () => { const [dir, id] = b.dataset.mv.split("|"); try { await api("POST", `/project/${cur}/scene/${id}/move`, { dir }); await load(); } catch (e) { fail(e); } });
    $$("[data-addafter]", card).forEach(b => b.onclick = () => addScene(b.dataset.addafter));
    $$("[data-delsc]", card).forEach(b => b.onclick = async () => { if (!confirm(`Xóa cảnh ${b.dataset.delsc}? (phiên bản trước vẫn được giữ)`)) return; try { await api("POST", `/project/${cur}/scene/${b.dataset.delsc}/delete`, {}); await load(); } catch (e) { fail(e); } });
    $$("[data-scene]", card).forEach(b => b.onclick = () => run("scene", { scene: b.dataset.scene }));
  });
}
